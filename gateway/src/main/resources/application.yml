server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: community
          uri: http://localhost:8081
          predicates:
            - Path=/api/community/**
          filters:
            - StripPrefix=2
        - id: knowledge
          uri: http://localhost:8082
          predicates:
            - Path=/api/knowledge/**
          filters:
            - StripPrefix=2
        - id: agent
          uri: http://localhost:8083
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=2
